<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <div class="product-card__image">
            <img src="prx.png" alt="Товар">
        </div>
        <div class="product-card__content">
            <h2 class="product-card__title">Часы Tissot PRX</h2>
            <p class="product-card__description">
                Tissot PRX — это популярная швейцарская коллекция часов в стиле 1970-х годов, сочетающая ретро-дизайн, интегрированный стальной браслет и современные характеристики.
            </p>
            <button class="product-card__btn">Купить</button>
        </div>
    </div>
</body>
</html>
